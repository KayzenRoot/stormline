# CORE-01 internal headless slice. Standard public runners only, read-only
# token, no secrets, no cache/artifact upload, no installation and no paid
# runner. Checkout is pinned to the reviewed commit used by the approved G3
# experiments.
name: CORE-01 internal headless

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/stormline/core/internal/**'
      - 'src/stormline/core/memory/**'
      - 'src/stormline/core/jobs/**'
      - 'src/stormline/core/time/**'
      - 'src/stormline/core/math/**'
      - 'src/stormline/core/diag/**'
      - 'src/stormline/data/vfs/**'
      - 'src/stormline/data/registry/**'
      - 'src/stormline/data/import/**'
      - 'src/stormline/data/scene/**'
      - 'src/stormline/data/bundle/**'
      - 'src/stormline/graphics/rhi/**'
      - 'benchmarks/core02/**'
      - 'tests/core/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/core01-internal-headless.yml'
      - 'docs/work-orders/NLE-PRPLAN-CORE-01-03.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-01-03.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-01-09.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-01-09.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-01-10.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-01-10.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-01-11.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-01-11.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-01-12.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-01-12.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-01-13.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-01-13.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-01-14.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-01-14.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-01-15.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-01-15.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-02-03.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-02-03.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-02-04.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-02-04.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-02-05.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-02-05.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-02-06.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-02-06.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-02-07.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-02-07.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-02-08.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-02-08.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-02-09.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-02-09.md'
      - 'docs/work-orders/NLE-CORE02-ALLOC-001.md'
      - 'docs/evidence/NLE-CORE02-ALLOC-001.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-03-03.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-03-03.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-03-03-G6-ACTIVATION.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-03-09.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-03-09.md'
      - 'docs/work-orders/NLE-PRPLAN-CORE-04-03.md'
      - 'docs/evidence/NLE-PRPLAN-CORE-04-03.md'

permissions:
  contents: read

concurrency:
  group: core01-internal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install authorized Linux window dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxinerama-dev \
            libxrender-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libdecor-0-dev \
            wayland-protocols \
            libdbus-1-dev \
            libibus-1.0-dev \
            libthai-dev \
            libfribidi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            xvfb \
            x11-utils \
            openbox
      - name: Toolchain provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "ImageVersion=$ImageVersion"
          uname -a
          ldd --version | sed -n '1p' || true
          c++ --version | sed -n '1p'
          cmake --version | sed -n '1p'
          ninja --version
      - name: Configure, build and test
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 &
          xvfb_pid=$!
          export DISPLAY=:99
          for attempt in {1..20}; do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          openbox --sm-disable >/dev/null 2>&1 &
          sleep 1
          cmake --preset core01-internal-debug
          cmake --build --preset core01-internal-debug
          ctest --preset core01-internal-debug --output-on-failure
          kill "$xvfb_pid" || true

  linux-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install authorized Linux window dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxinerama-dev \
            libxrender-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libdecor-0-dev \
            wayland-protocols \
            libdbus-1-dev \
            libibus-1.0-dev \
            libthai-dev \
            libfribidi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            xvfb \
            x11-utils \
            openbox
      - name: Detect preinstalled ASan/UBSan support
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if printf 'int main() { return 0; }\n' | c++ -x c++ -std=c++20 -fsanitize=address,undefined -o /tmp/stormline-sanitizer-probe - >/dev/null 2>&1; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "ASan/UBSan supported by preinstalled toolchain"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "**SANITIZERS_NOT_QUALIFIED**: preinstalled toolchain does not support ASan/UBSan; no sanitizer tests ran." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure, build and test with sanitizers
        if: steps.detect.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 &
          xvfb_pid=$!
          export DISPLAY=:99
          for attempt in {1..20}; do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          openbox --sm-disable >/dev/null 2>&1 &
          sleep 1
          cat > /tmp/stormline-lsan.supp <<'EOF'
          leak:X11_
          EOF
          export LSAN_OPTIONS=suppressions=/tmp/stormline-lsan.supp:print_suppressions=0
          c++ --version | sed -n '1p'
          cmake --version | sed -n '1p'
          ninja --version
          cmake --preset core01-internal-asan
          cmake --build --preset core01-internal-asan
          ctest --preset core01-internal-asan --output-on-failure
          kill "$xvfb_pid" || true

  core03-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install authorized Linux window dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxinerama-dev \
            libxrender-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libdecor-0-dev \
            wayland-protocols \
            libdbus-1-dev \
            libibus-1.0-dev \
            libthai-dev \
            libfribidi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            xvfb \
            x11-utils \
            openbox
      - name: Detect preinstalled TSan support
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if printf 'int main() { return 0; }\n' | c++ -x c++ -std=c++20 -fsanitize=thread -o /tmp/stormline-tsan-probe - >/dev/null 2>&1; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "TSan supported by preinstalled toolchain"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "**TSAN_NOT_QUALIFIED**: preinstalled toolchain does not support TSan; CORE-03 implementation is BLOCKED." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Configure, build and test with ThreadSanitizer
        if: steps.detect.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          c++ --version | sed -n '1p'
          cmake --version | sed -n '1p'
          ninja --version
          cmake -S . -B build/core03-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSTORMLINE_CORE03_ENABLE_TSAN=ON
          cmake --build build/core03-tsan --target stormline_core03_jobs_test stormline_core03_qualification_test stormline_core04_clock_test stormline_core04_timeline_test stormline_core04_qualification_test stormline_core05_vector_test stormline_core05_matrix_quat_test stormline_core05_coord_test stormline_core05_unit_test stormline_core05_precision_test stormline_core05_id_test stormline_core05_qualification_test stormline_core06_log_test stormline_core06_trace_test stormline_core06_counter_test stormline_core06_crash_test stormline_core06_profile_test stormline_core06_telemetry_test stormline_core06_qualification_test stormline_data01_path_test stormline_data01_mount_test stormline_data01_overlay_test stormline_data01_capability_test stormline_data01_cache_test stormline_data01_storage_test stormline_data01_vfs_qualification_test stormline_data02_id_test stormline_data02_dependency_test stormline_data02_tag_test stormline_data02_query_test stormline_data02_schema_test stormline_data02_reference_test stormline_data02_registry_qualification_test stormline_data03_importer_test stormline_data03_texture_test stormline_data03_animation_test stormline_data03_audio_test stormline_data03_validation_test stormline_data03_receipt_test stormline_data03_import_qualification_test stormline_data04_schema_test stormline_data04_document_test stormline_data04_patch_test stormline_data04_diff_test stormline_data04_scene_qualification_test stormline_data05_target_test stormline_data05_rle_test stormline_data05_stream_test stormline_data05_manifest_test stormline_data05_patch_test stormline_data05_bundle_qualification_test stormline_gfx01_device_test stormline_gfx01_queue_test stormline_gfx01_buffer_test stormline_gfx01_texture_test stormline_gfx01_sync_test stormline_gfx01_feature_test stormline_gfx01_rhi_qualification_test stormline_gfx02_shader_test stormline_gfx02_reflection_test stormline_gfx02_variant_test stormline_gfx02_cache_test stormline_gfx02_incremental_test stormline_gfx02_shader_qualification_test stormline_gfx03_graph_test stormline_gfx03_dependency_test stormline_gfx03_sync_test stormline_gfx03_transient_test stormline_gfx03_budget_test stormline_gfx03_graph_qualification_test stormline_gfx04_instance_test stormline_gfx04_cull_test stormline_gfx04_lod_test stormline_gfx04_stream_test stormline_gfx04_vegetation_test stormline_gfx04_budget_test stormline_gfx04_geometry_qualification_test stormline_gfx05_material_test stormline_gfx05_texture_test stormline_gfx05_mip_test stormline_gfx05_sampler_test stormline_gfx05_decal_test stormline_gfx05_transparency_test stormline_gfx05_material_qualification_test stormline_gfx06_light_test stormline_gfx06_shadow_test stormline_gfx06_gi_test stormline_gfx06_probe_test stormline_gfx06_reflection_test stormline_gfx06_volumetric_test stormline_gfx06_lighting_qualification_test stormline_gfx07_camera_test stormline_gfx07_color_test stormline_gfx07_output_test stormline_gfx07_reconstruction_test stormline_gfx07_motion_blur_test stormline_gfx07_upscale_test stormline_gfx07_post_qualification_test stormline_gfx08_particle_test stormline_gfx08_ribbon_test stormline_gfx08_trail_test stormline_gfx08_blend_test stormline_gfx08_density_test
          setarch "$(uname -m)" -R env TSAN_OPTIONS="halt_on_error=1 second_deadlock_stack=1" \
            ctest --test-dir build/core03-tsan -R '^(core03_|core04_|core05_)' --output-on-failure

  allocator-benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: windows-2025-vs2026
          - runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure, build and run (Windows MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cmake --preset core02-alloc-bench
          if errorlevel 1 exit /b 1
          cmake --build --preset core02-alloc-bench --target stormline_core02_allocator_bench
          if errorlevel 1 exit /b 1
          ctest --test-dir build/core02-alloc-bench -R core02_allocator_bench -V
      - name: Configure, build and run (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset core02-alloc-bench
          cmake --build --preset core02-alloc-bench --target stormline_core02_allocator_bench
          ctest --test-dir build/core02-alloc-bench -R core02_allocator_bench -V

  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Toolchain provenance, configure, build and test
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          echo ImageVersion=%ImageVersion%
          cl /Bv
          cmake --version
          ninja --version
          cmake --preset core01-internal-debug
          if errorlevel 1 exit /b 1
          cmake --build --preset core01-internal-debug
          if errorlevel 1 exit /b 1
          ctest --preset core01-internal-debug --output-on-failure
          if errorlevel 1 exit /b 1

  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Toolchain provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "ImageVersion=$ImageVersion"
          uname -m
          sw_vers
          c++ --version | sed -n '1p'
          cmake --version | sed -n '1p'
          ninja --version
      - name: Configure, build and test
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset core01-internal-debug
          cmake --build --preset core01-internal-debug
          env -u DISPLAY ctest --preset core01-internal-debug --output-on-failure
