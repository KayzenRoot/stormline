name: Docs Validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-validation:
    name: docs-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Source Pack & local link validation
        run: python3 scripts/validate_docs.py
      - name: Module taxonomy and dependency DAG validation
        run: python3 scripts/validate_module_catalog.py
      - name: Work Order registry validation
        run: python3 scripts/validate_wo_registry.py
