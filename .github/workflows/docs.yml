name: Docs Validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-validation:
    name: docs-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Source Pack & local link validation
        run: python3 scripts/validate_docs.py
      - name: Module taxonomy and dependency DAG validation
        run: python3 scripts/validate_module_catalog.py
      - name: Work Order registry validation
        run: python3 scripts/validate_wo_registry.py
      - name: Zcode selector must reject blocked packets
        run: |
          python3 scripts/select_wo.py --list > /dev/null
          set +e
          python3 scripts/select_wo.py CORE-01 --json > /tmp/stormline-wo-guard.json
          status=$?
          set -e
          test "$status" -eq 2
          python3 -c "import json; x=json.load(open('/tmp/stormline-wo-guard.json')); assert x['executor_ready'] is False; assert x['status'].startswith('BLOCKED_')"
      - name: Skill Pack format, links and 80-module mapping
        run: python3 scripts/validate_skills.py
      - name: Skill Pack validator unit tests
        run: python3 -m unittest discover -s scripts -p test_validate_skills.py
